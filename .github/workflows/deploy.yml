name: Deploy Lambda via Serverless

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Choose environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      pythonLocation: /opt/hostedtoolcache/Python/3.9.23/x64
      PKG_CONFIG_PATH: /opt/hostedtoolcache/Python/3.9.23/x64/lib/pkgconfig

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Serverless Framework
        run: |
          echo "Installing Serverless Framework..."
          if ! npm install -g serverless@3; then
            echo "Failed to install Serverless Framework"
            exit 1
          fi

      - name: Set AWS credentials based on stage
        run: |
          echo "Setting AWS credentials for stage: ${{ github.event.inputs.stage }}"
          if [ "${{ github.event.inputs.stage }}" == "dev" ]; then
            echo "AWS_ACCESS_KEY_ID=${{ secrets.DEV_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.stage }}" == "qa" ]; then
            echo "AWS_ACCESS_KEY_ID=${{ secrets.QA_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.QA_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.stage }}" == "prod" ]; then
            echo "AWS_ACCESS_KEY_ID=${{ secrets.PROD_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          else
            echo "Invalid stage selected"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Validate Serverless config
        run: |
          echo "Validating Serverless configuration..."
          if ! sls print --stage ${{ github.event.inputs.stage }}; then
            echo "Serverless config validation failed"
            exit 1
          fi

      - name: Deploy with Serverless
        run: |
          echo "Starting deployment for stage: ${{ github.event.inputs.stage }}"
          if ! sls deploy --stage ${{ github.event.inputs.stage }}; then
            echo "Deployment failed for stage: ${{ github.event.inputs.stage }}"
            exit 1
          fi

      - name: Show deployment info
        run: sls info --stage ${{ github.event.inputs.stage }}
